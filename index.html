<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --green:#2f6b4f; --green2:#eaf5ee; --ink:#18201b; --muted:#66706a; --line:#e3e9e5; --bg:#f7f8f4; --card:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    .hero { padding:42px 24px 26px; background:linear-gradient(120deg,#ffffff,#eff7f0); border-bottom:1px solid var(--line); }
    .wrap { max-width:1180px; margin:0 auto; }
    h1 { margin:0; font-size:42px; line-height:1.05; letter-spacing:-1px; }
    .sub { margin:12px 0 0; color:var(--muted); font-size:16px; max-width:720px; }
    .toolbar { display:grid; grid-template-columns: 1fr auto; gap:14px; align-items:center; padding:20px 24px; position:sticky; top:0; z-index:10; background:rgba(247,248,244,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .search { width:100%; border:1px solid var(--line); border-radius:16px; padding:14px 16px; font-size:16px; background:#fff; outline:none; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .filter { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:650; }
    .filter.active { background:var(--green); color:#fff; border-color:var(--green); }
    .stats { color:var(--muted); padding:0 24px 18px; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; padding:0 24px 42px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:0 10px 30px rgba(18,32,22,.06); display:flex; flex-direction:column; min-height:100%; }
    .photo { width:100%; aspect-ratio: 4 / 5; object-fit:cover; background:#e8ece8; display:block; }
    .content { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .plant-id { font-weight:800; font-size:18px; }
    .badge { border-radius:999px; padding:6px 10px; font-size:12px; font-weight:800; background:var(--green2); color:var(--green); }
    .meta { display:grid; gap:6px; color:var(--muted); font-size:14px; }
    .meta strong { color:var(--ink); }
    .status { border-radius:16px; padding:12px; background:#f1f5f2; color:var(--muted); font-size:14px; min-height:44px; }
    .status.claimed { background:#e7f3eb; color:#214f39; font-weight:750; }
    .actions { margin-top:auto; display:grid; gap:8px; }
    .claim-row { display:grid; grid-template-columns:1fr auto; gap:8px; }
    input.name { border:1px solid var(--line); border-radius:14px; padding:11px 12px; font-size:14px; min-width:0; }
    button { font:inherit; }
    .btn { border:none; border-radius:14px; padding:11px 13px; font-weight:800; cursor:pointer; background:var(--green); color:#fff; }
    .btn:disabled { background:#cfd8d2; color:#6d7a71; cursor:not-allowed; }
    .secondary { background:#fff; color:var(--green); border:1px solid var(--line); }
    .danger { background:#fff; color:#8a342b; border:1px solid #f0d8d4; }
    .hidden { display:none !important; }
    .empty { text-align:center; color:var(--muted); padding:44px 20px; }
    @media (max-width:720px){ h1{font-size:32px}.toolbar{grid-template-columns:1fr}.filters{justify-content:flex-start}.hero{padding-top:30px}.grid{grid-template-columns:1fr}.claim-row{grid-template-columns:1fr} }
  </style>
</head>

  </header>

    <section class="toolbar">

        <button class="filter" data-floor="12th">12th floor</button>
        <button class="filter" data-floor="available">Available</button>

    </section>
    <div class="stats" id="stats"></div>
    <section id="plantGrid" class="grid"></section>
    <div id="emptyState" class="empty hidden">No plants match that search.</div>
  </main>

let claims = {};
let activeFloor = "all";
let searchText = "";
let adminMode = false;

function myClaims() {
  return JSON.parse(localStorage.getItem("myPlantClaims") || "{}");
}
function saveMyClaim(id, name) {
  const current = myClaims();
  current[id] = name;
  localStorage.setItem("myPlantClaims", JSON.stringify(current));
}
function removeMyClaim(id) {
  const current = myClaims();
  delete current[id];
  localStorage.setItem("myPlantClaims", JSON.stringify(current));
}
function normalize(value){ return String(value || "").toLowerCase(); }

function renderPlants() {
  const grid = document.getElementById("plantGrid");
  const owned = myClaims();
  const filtered = plants.filter(p => {
    const claim = claims[p.id];
    const isClaimed = !!claim?.claimed;
    const floorMatch = activeFloor === "all" || p.floor === activeFloor || (activeFloor === "available" && !isClaimed);
    const text = `${p.id} ${p.size} ${p.floor} ${p.room}`;
    const searchMatch = normalize(text).includes(normalize(searchText));
    return floorMatch && searchMatch;
  });
const typedNames = {};
document.querySelectorAll("input.name").forEach(input => {
  typedNames[input.id] = input.value;
});
  grid.innerHTML = filtered.map(p => {
    const claim = claims[p.id];
    const isClaimed = !!claim?.claimed;
    const isMine = owned[p.id] && owned[p.id] === claim?.claimer;
    const status = isClaimed ? `Claimed by ${escapeHtml(claim.claimer || "someone")}` : "Available to claim";
    return `
      <article class="card" id="plant-${p.id}">
<img 
  class="photo" 
  src="./${p.image}" 
  alt="Plant ${p.id}" 
  loading="lazy"
  onerror="this.style.display='none'"
>
<div class="content">
          <div class="topline">
            <div class="plant-id">Plant ${p.id}</div>
            <div class="badge">${p.floor} floor</div>
          </div>
          <div class="meta">
            <div><strong>Size:</strong> ${p.size}</div>
            <div><strong>Room:</strong> ${escapeHtml(p.room)}</div>
          </div>
          <div class="status ${isClaimed ? "claimed" : ""}" id="status-${p.id}">${status}</div>
          <div class="actions">
          <div class="claim-row ${isClaimed ? "hidden" : ""}">
  <button class="btn" onclick="claimPlant(${p.id})">Claim this plant</button>
</div>
            <button class="btn secondary ${isMine ? "" : "hidden"}" onclick="unclaimMine(${p.id})">Unclaim my plant</button>
            <button class="btn danger ${adminMode ? "" : "hidden"}" onclick="adminUnclaim(${p.id})">Admin unclaim</button>
          </div>
        </div>
      </article>`;
  }).join("");

  document.getElementById("emptyState").classList.toggle("hidden", filtered.length > 0);
  const claimedCount = Object.values(claims).filter(c => c.claimed).length;
  document.getElementById("stats").textContent = `${filtered.length} shown • ${claimedCount} claimed • ${plants.length - claimedCount} available`;
}

async function loadClaims() {
  const { data, error } = await supabaseClient.from("plants").select("*");
  if (error) { console.error(error); return; }
  claims = {};
  (data || []).forEach(row => { claims[row.id] = row; });
  renderPlants();
}

async function claimPlant(id) {
  const name = prompt("Enter your name to claim this plant:");
  if (!name || !name.trim()) return;

  const cleanName = name.trim();

  const existing = claims[id];
  if (existing?.claimed) { alert("Sorry, this plant was already claimed."); await loadClaims(); return; }

  const { error } = await supabaseClient.from("plants").upsert({
    id, claimed: true, claimer: cleanName, claimed_at: new Date().toISOString()
  });
  if (error) { alert("Something went wrong while claiming. Try again."); console.error(error); return; }
  saveMyClaim(id, cleanName);
  await loadClaims();
}

async function unclaimMine(id) {
  const owned = myClaims();
  if (!owned[id]) { alert("This browser does not recognize this as your claim."); return; }
  if (!confirm("Unclaim this plant?")) return;
  const { error } = await supabaseClient.from("plants").update({ claimed:false, claimer:null, claimed_at:null }).eq("id", id);
  if (error) { alert("Could not unclaim. Try again."); console.error(error); return; }
  removeMyClaim(id);
  await loadClaims();
}

async function adminUnclaim(id) {
  if (!adminMode) { alert("Admin mode is not unlocked."); return; }
  if (!confirm("Admin unclaim this plant?")) return;
  const { error } = await supabaseClient.from("plants").update({ claimed:false, claimer:null, claimed_at:null }).eq("id", id);
  if (error) { alert("Could not unclaim. Try again."); console.error(error); return; }
  removeMyClaim(id);
  await loadClaims();
}

function escapeHtml(value) {
  return String(value || "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
}

function unlockAdminMode() {
  const password = prompt("Admin password:");
  if (password === ADMIN_PASSWORD) {
    adminMode = true;
    alert("Admin mode unlocked. Admin unclaim buttons are now visible.");
    renderPlants();
  } else if (password !== null) {
    alert("Incorrect password.");
  }
}

document.addEventListener("keydown", event => {
  if (event.shiftKey && event.key.toLowerCase() === "a") {
    unlockAdminMode();
  }
});

document.getElementById("searchInput").addEventListener("input", e => { searchText = e.target.value; renderPlants(); });
document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFloor = btn.dataset.floor;
    renderPlants();
  });
});
